<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Research Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #000; --surface: #111; --surface-raised: #1a1a1a;
  --border: #222; --border-visible: #333;
  --text-disabled: #666; --text-secondary: #999; --text-primary: #e8e8e8; --text-display: #fff;
  --accent-red: #d71921; --utility-orange: #f26522;
  --font-human: "Space Grotesk", "PingFang SC", system-ui, sans-serif;
  --font-machine: "Space Mono", "PingFang SC", ui-monospace, monospace;
  --font-dot: "Doto", "Space Mono", monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px;
  --r-card: 16px; --r-thumb: 8px;
  --panel-w: 400px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--black); color: var(--text-primary); font: 400 14px/1.55 var(--font-human); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }

#sea { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#sea.panning { cursor: grabbing; }

.meta { font: 400 11px/1.5 var(--font-machine); letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); }
.dim { color: var(--text-disabled); }
.title { font: 500 20px/1.2 var(--font-human); letter-spacing: -.01em; color: var(--text-display); }

/* 点阵字形：图标由 5×5 点构成 */
.glyph { display: inline-grid; grid-template-columns: repeat(5, 2px); grid-auto-rows: 2px; gap: 1px; flex: none; }
.glyph i { border-radius: 50%; background: currentColor; opacity: .14; transition: opacity .14s var(--ease); }
.glyph i.on { opacity: 1; }

.chrome { position: fixed; z-index: 10; transition: transform .42s var(--ease-back), opacity .3s var(--ease); }
body.panel-open .shift { transform: translateX(calc(-1 * var(--panel-w) - var(--s-4))); }
#masthead { left: var(--s-6); top: var(--s-4); pointer-events: none; max-width: min(480px, 32vw); }
#masthead .title, #masthead .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#masthead .title + .meta { margin-top: 2px; }
#tools { right: var(--s-6); top: var(--s-5); display: flex; gap: 6px; transition: transform .56s var(--ease-drawer), opacity .3s var(--ease); }
.tool { height: 32px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font: 400 11px/1 var(--font-machine); letter-spacing: .08em; text-transform: uppercase; color: var(--text-secondary); transition: border-color .2s ease-out, color .2s ease-out, transform .16s var(--ease); }
.tool:active { transform: scale(.96); }
.tool[aria-pressed="true"] { color: var(--text-display); border-color: var(--border-visible); }
@media (hover: hover) and (pointer: fine) { .tool:hover { color: var(--text-primary); border-color: var(--border-visible); } }

body.panel-open #masthead { opacity: 0; transform: translateY(-6px); }
body.focused #hud { opacity: 0; transform: translateY(6px); }
#hud { left: var(--s-6); bottom: var(--s-5); max-width: min(560px, 60vw); pointer-events: none; }
#hud .meta { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
#hud .line { margin-top: 4px; font: 400 14px/1.4 var(--font-human); color: var(--text-primary); min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segs { display: inline-flex; gap: 2px; }
.segs i { width: 6px; height: 10px; background: #242424; }
.segs i.on { background: var(--text-primary); }

#index { right: var(--s-6); bottom: var(--s-5); display: grid; gap: 2px; justify-items: end; max-height: 44vh; overflow-y: auto; scrollbar-width: none; opacity: .72; }
#index::-webkit-scrollbar { display: none; }
#index:hover, #index.expanded { opacity: 1; }
#index.expanded + #gauge { opacity: 0; }
#index .idx.is-extra { display: none; }
#index.expanded .idx.is-extra { display: grid; }
#index.expanded { mask-image: linear-gradient(to bottom, transparent, #000 24px); }
.idx .name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.idx-more { padding: 4px 0 0; color: var(--text-disabled); }
.idx-more:hover { color: var(--text-primary); }
body.panel-open #index { opacity: 0; pointer-events: none; transform: translateX(12px); }
.idx { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: end; gap: 12px; padding: 3px 0; font-size: 12px; color: var(--text-disabled); transition: color .2s ease-out; }
.idx .segs i { width: 3px; height: 9px; transform: scaleY(.5); transition: transform .3s var(--ease-back), background-color .2s ease-out; }
.idx .segs i.on { background: var(--text-disabled); }
.idx:hover, .idx.is-on { color: var(--text-primary); }
.idx:hover .segs i, .idx.is-on .segs i { transform: none; }
.idx:hover .segs i.on, .idx.is-on .segs i.on { background: var(--text-primary); }

#gauge { right: var(--s-6); top: 50%; display: grid; gap: 5px; justify-items: end; transform: translateY(-50%); }
body.panel-open #gauge { transform: translate(calc(-1 * var(--panel-w) - var(--s-4)), -50%); }
#gauge i { width: 8px; height: 2px; background: var(--border-visible); transition: background-color .2s ease-out, width .3s var(--ease-back); }
#gauge i.on { background: var(--text-primary); width: 14px; }
#gauge span { margin-top: 6px; font: 400 10px/1 var(--font-machine); letter-spacing: .08em; color: var(--text-disabled); writing-mode: vertical-rl; transform: rotate(180deg); }
#switch { left: 50%; top: var(--s-5); transform: translateX(-50%); display: flex; gap: 8px; }
body.panel-open #switch { opacity: 0; pointer-events: none; }
.seg { display: flex; padding: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
.seg button { height: 26px; padding: 0 12px; border-radius: 999px; font: 400 11px/1 var(--font-machine); letter-spacing: .08em; text-transform: uppercase; color: var(--text-disabled); transition: color .2s ease-out, background-color .2s ease-out; }
.seg button:hover { color: var(--text-primary); }
.seg button[aria-pressed="true"] { color: var(--text-display); background: var(--surface-raised); }
#marquee { position: fixed; z-index: 5; display: none; pointer-events: none; border: 1px dashed rgb(232 232 232 / .5); background: rgb(255 255 255 / .03); }

/* 面板：一列 bento 卡片 */
#panel { position: fixed; z-index: 20; top: var(--s-4); right: var(--s-4); bottom: var(--s-4); width: var(--panel-w); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; display: none; }
#panel::-webkit-scrollbar { display: none; }
#panel-body { display: grid; gap: 10px; padding-bottom: var(--s-4); }
.card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--s-5); transition: border-color .2s ease-out; }
.card:hover { border-color: var(--border-visible); }
.card > .meta:first-of-type, .card > .row:first-of-type { margin-bottom: var(--s-3); }
.shine { position: absolute; top: -30%; bottom: -30%; left: -140px; width: 110px; pointer-events: none; z-index: 2; opacity: 0; transform: skewX(-14deg); background: linear-gradient(100deg, transparent, rgb(255 255 255 / .04) 35%, rgb(255 255 255 / .10) 50%, rgb(255 255 255 / .04) 65%, transparent); }
.shine.play { animation: shimmer 1.05s var(--ease) forwards; }
@keyframes shimmer { 0% { left: -140px; opacity: 1; } 100% { left: 110%; opacity: 0; } }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); }
.led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-red); animation: pulse 1.6s var(--ease) infinite; margin-right: 8px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .18; } }
#panel-close { display: inline-flex; align-items: center; gap: 6px; color: var(--text-disabled); transition: color .2s ease-out; }
#panel-close:hover { color: var(--text-primary); }

.body-text { font: 400 15px/1.6 var(--font-human); color: var(--text-primary); }
.sub-text { font-size: 13px; color: var(--text-secondary); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats .card { padding: var(--s-4) var(--s-5); }
.dot-num { font: 400 52px/1 var(--font-dot); color: var(--text-display); font-variant-numeric: tabular-nums; margin-top: 10px; }
.big-segs { display: flex; gap: 3px; height: 14px; margin-top: 26px; }
.big-segs i { flex: 1; background: #242424; transform: scale(.3); opacity: 0; animation: seg-in .3s var(--ease-back) forwards; }
.big-segs i:nth-child(2) { animation-delay: 40ms; } .big-segs i:nth-child(3) { animation-delay: 80ms; } .big-segs i:nth-child(4) { animation-delay: 120ms; }
.big-segs i.on { background: var(--text-primary); }
@keyframes seg-in { to { transform: scale(1); opacity: 1; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s-3); }
.chip { height: 26px; padding: 0 10px; border: 1px solid var(--border-visible); border-radius: 999px; font-size: 12px; color: var(--text-secondary); transition: color .2s ease-out, border-color .2s ease-out, transform .16s var(--ease); }
.chip:hover { color: var(--text-primary); border-color: var(--text-disabled); }
.chip:active { transform: scale(.96); }
.note { margin-top: var(--s-4); padding-top: var(--s-4); border-top: 1px solid var(--border); }
.note p { margin-top: 6px; font-size: 13px; color: var(--text-secondary); }
.trail { list-style: none; display: grid; gap: 2px; }
.trail li { display: grid; grid-template-columns: 24px 26px 1fr; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; }
.trail li .n { font: 400 11px/1 var(--font-machine); color: var(--text-disabled); letter-spacing: .08em; }
.trail li img { width: 26px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-visible); }
.trail li b { display: block; font-weight: 500; font-size: 13px; color: var(--text-primary); }
.trail li span { display: block; font-size: 12px; color: var(--text-secondary); }
.trail li em { display: block; font-style: normal; font-size: 11px; color: var(--text-disabled); }
.trail li.self b, .trail li.self .n { color: var(--text-display); }
@media (hover: hover) and (pointer: fine) { .trail li:hover b { text-decoration: underline; text-decoration-color: var(--text-disabled); text-underline-offset: 3px; } }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.thumb { position: relative; display: block; aspect-ratio: 1179 / 2556; border-radius: var(--r-thumb); overflow: hidden; border: 1px solid var(--border); background: var(--surface-raised); transition: border-color .2s ease-out, transform .25s var(--ease-back); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; font: 700 9px/1 var(--font-machine); letter-spacing: .12em; color: var(--text-primary); background: linear-gradient(transparent, rgb(0 0 0 / .8)); text-align: left; }
.thumb:hover { border-color: var(--text-disabled); transform: translateY(-2px); }
.thumb:active { transform: scale(.97); }
.echo { margin-top: var(--s-3); font-size: 13px; color: var(--text-secondary); }
.echo b { font: 700 9px/1 var(--font-machine); letter-spacing: .12em; color: var(--text-primary); margin-right: 8px; }
.list-item { display: block; width: 100%; text-align: left; padding: var(--s-3) 0; border-top: 1px solid var(--border); }
.card > .meta + .list-item, .card > .row + .list-item { border-top: 0; padding-top: 0; }
.list-item .meta { margin-top: 6px; }
@media (hover: hover) and (pointer: fine) { button.list-item:hover .body-text { color: var(--text-display); } }
.qs { list-style: none; counter-reset: q; display: grid; gap: 6px; margin-top: var(--s-3); }
.qs li { counter-increment: q; display: grid; grid-template-columns: 24px 1fr; font-size: 13px; color: var(--text-secondary); }
.qs li::before { content: counter(q, decimal-leading-zero); font: 400 11px/1.8 var(--font-machine); color: var(--text-disabled); }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; font-size: 12px; color: var(--text-secondary); }
.bar .segs { grid-column: 1 / -1; display: flex; }
.bar .segs i { flex: 1; height: 8px; }
.bar em { font: 400 11px/1.5 var(--font-machine); font-style: normal; color: var(--text-disabled); }
.clip { max-height: var(--clip, 200px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.clip::-webkit-scrollbar { display: none; }
.clip.fade-b { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); }
.clip.fade-t { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 32px); mask-image: linear-gradient(to bottom, transparent, #000 32px); }
.clip.fade-t.fade-b { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 32px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to bottom, transparent, #000 32px, #000 calc(100% - 40px), transparent); }
.card .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.source { display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: var(--text-secondary); }
.source:hover { color: var(--text-primary); }
.source .meta { color: inherit; }

@media (prefers-reduced-motion: reduce) {
  .shine.play, .led, .big-segs i { animation: none; }
  .big-segs i { transform: none; opacity: 1; }
}
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="marquee"></div>

<header id="masthead" class="chrome">
  <h1 class="title"></h1>
  <div class="meta dim" id="mast-sub"></div>
</header>
<nav id="tools" class="chrome">
  <button class="tool" id="t-insight" aria-pressed="false" title="洞察（I）"><span class="glyph" data-g="insight"></span>Insight</button>
  <button class="tool" id="t-replay" title="重播入场"><span class="glyph" data-g="replay"></span>Replay</button>
</nav>
<div id="hud" class="chrome">
  <div class="meta" id="hud-meta"></div>
  <div class="line" id="hud-line"></div>
</div>
<div id="index" class="chrome"></div>
<div id="gauge" class="chrome shift" aria-hidden="true"></div>
<div id="switch" class="chrome" role="group" aria-label="视图对比">
  <div class="seg" data-key="layout"><button data-v="island">Island</button><button data-v="lanes">Lanes</button></div>
</div>

<aside id="panel"><div id="panel-body"></div></aside>

<script src="research.js"></script>
<script>
(() => {
"use strict";
const DATA = window.RESEARCH;
if (!DATA) { document.body.innerHTML = '<p style="padding:32px;font:14px system-ui;color:#999">没有找到 research.js。请先运行 python3 scripts/build_web.py &lt;调研目录&gt;。</p>'; return; }

// ---------- 点阵字形 ----------
const GLYPHS = {
  insight: "..#...###.#####.###...#..",
  replay:  ".###.#...##.#.##...#.###.",
  close:   "#...#.#.#...#...#.#.#...#",
  out:     "..###...##..#.#.#...#....",
};
const glyph = name => `<span class="glyph">${[...GLYPHS[name]].map(c => `<i class="${c === "#" ? "on" : ""}"></i>`).join("")}</span>`;
document.querySelectorAll(".glyph[data-g]").forEach(el => { el.outerHTML = glyph(el.dataset.g); });

// ---------- 常量 ----------
const G = 26, TW = 36, TH = 78;   // 点阵间距与截图尺寸（世界单位）
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n, w = 3) => String(n).padStart(w, "0");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const backOut = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// ---------- 数据 ----------
const screens = DATA.screens, byId = new Map(screens.map(s => [s.id, s]));
const leadById = new Map((DATA.leads || []).map(l => [l.id, l]));
const patById = new Map(DATA.patterns.map(p => [p.id, p]));
const echoes = new Map();
for (const e of DATA.echoes || []) for (const [a, b] of [[e.a, e.b], [e.b, e.a]]) {
  if (!echoes.has(a)) echoes.set(a, []);
  echoes.get(a).push({ other: b, kind: e.kind, note: e.note });
}
for (const s of screens) { s.lead = s.found_via ? leadById.get(s.found_via) : null; s.parent = s.lead && s.lead.from != null ? s.lead.from : null; }
const RINGS = ["R1", "R2", "R3", "R4"], depth = s => RINGS.indexOf(s.ring) + 1;
const covered = new Set();
const rng = n => { let t = (n * 2654435761) >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; };
const trail = s => { const out = [], seen = new Set(); let c = s; while (c && !seen.has(c.id)) { out.unshift(c); seen.add(c.id); c = c.parent != null ? byId.get(c.parent) : null; } return out; };

// ---------- 关系 ----------
function relation(a, b) {
  const pa = new Set(a.patterns), shared = b.patterns.filter(p => pa.has(p)).length;
  const jac = shared / new Set([...a.patterns, ...b.patterns]).size;
  let lin = 0, tag = shared ? "PATTERN" : "APP";
  if (a.parent === b.id || b.parent === a.id) { lin = 1; tag = "LEAD"; }
  else if (a.found_via && a.found_via === b.found_via) { lin = .7; tag = "SIBLING"; }
  else if (a.parent != null && a.parent === b.parent) { lin = .5; tag = "SIBLING"; }
  const e = (echoes.get(a.id) || []).find(x => x.other === b.id);
  if (e) tag = e.kind === "contrast" ? "CONTRAST" : "ECHO";
  return { score: jac * .6 + lin * .55 + (e ? 1 : 0) + (a.app === b.app ? .15 : 0), tag };
}
// 关联最多 8 张，并按类型限额以保证多样；名额没用满时再按分数补齐。
// 分数相同时，优先深度相近、来自不同 App 的图
const REL_CAP = { lineage: 3, echo: 3, pattern: 4, app: 2 }, REL_MAX = 8;
const relKind = t => t === "LEAD" || t === "SIBLING" ? "lineage" : t === "ECHO" || t === "CONTRAST" ? "echo" : t === "PATTERN" ? "pattern" : "app";
function relatedOf(f) {
  const all = screens.filter(s => s !== f).map(s => ({ s, ...relation(f, s) })).filter(o => o.score >= .3)
    .sort((x, y) => y.score - x.score || Math.abs(depth(x.s) - depth(f)) - Math.abs(depth(y.s) - depth(f)) || (x.s.app === f.app) - (y.s.app === f.app) || x.s.id - y.s.id);
  const used = {}, out = [];
  for (const o of all) { const k = relKind(o.tag); if (out.length < REL_MAX && (used[k] || 0) < REL_CAP[k]) { out.push(o); used[k] = (used[k] || 0) + 1; } }
  for (const o of all) { if (out.length >= REL_MAX) break; if (!out.includes(o)) out.push(o); }
  return out.sort((x, y) => y.score - x.score);
}

// ---------- 布局 ----------
// 图片中心落在点阵的格点上：列距 2G、行距 4G，四周露出一圈点
const CX = 2 * G, CY = 4 * G, LANE_Y = 6 * G;
const params = new URLSearchParams(location.search);
const view = {
  layout: ["island", "lanes"].includes(params.get("layout")) ? params.get("layout") : "island",
};

// 模式顺序：常一起出现的模式相邻
const patOrder = (() => {
  const pats = DATA.patterns.map(p => ({ id: p.id, name: p.name, n: screens.filter(s => s.patterns[0] === p.id).length }));
  const co = new Map(), key = (a, b) => [a, b].sort().join("|");
  for (const s of screens) for (const p of s.patterns.slice(1)) co.set(key(s.patterns[0], p), (co.get(key(s.patterns[0], p)) || 0) + 1);
  const order = [pats.slice().sort((a, b) => b.n - a.n)[0]];
  while (order.length < pats.length) {
    const last = order[order.length - 1];
    order.push(pats.filter(p => !order.includes(p)).sort((a, b) => (co.get(key(last.id, b.id)) || 0) - (co.get(key(last.id, a.id)) || 0) || b.n - a.n)[0]);
  }
  return order;
})();

// 岛屿：圈层定半径、模式定方向，关系弹簧拉近相关的图，最后逐张吸附到最近的空格点
let islandCache = null;
function islandPositions() {
  const total = patOrder.reduce((t, p) => t + Math.max(p.n, 2), 0);
  const sec = new Map(); let a = -Math.PI / 2;
  for (const p of patOrder) { const w = Math.max(p.n, 2) / total * Math.PI * 2; sec.set(p.id, { a0: a, w, idx: sec.size }); a += w; }
  const area = CX * CY / .8, bands = {};
  let r0 = 0;
  for (const r of RINGS) { const n = screens.filter(s => s.ring === r).length; const r1 = Math.sqrt(r0 * r0 + n * area / Math.PI); bands[r] = [r0, r1]; r0 = r1 + 8; }
  const P = new Map();
  for (const s of screens) {

        <section class="card"><div class="meta">Related</div><div class="dot-num">${pad(st.related.length, 2)}</div></section>
      </div>
      <section class="card"><div class="meta">Insight</div><div class="clip" style="--clip:168px"><p class="body-text">${esc(s.insight)}</p></div>
        <div class="note"><div class="meta dim">Agent note / round ${pad(s.round ?? 0, 2)}</div><div class="clip" style="--clip:132px"><p>${esc(s.why_saved)}</p></div></div></section>
      <section class="card"><div class="row meta"><span>Trail</span><span class="dim">${pad(tr.length, 2)} steps</span></div>
        <ol class="trail clip" style="--clip:300px">${tr.map((c, i) => `<li data-goto="${c.id}" class="${c === s ? "self" : ""}"><span class="n">${pad(i + 1, 2)}</span><img src="${esc(c.thumb)}" alt=""><div><b>${esc(c.app)}</b><span>${esc(c.lead ? c.lead.text : "起点")}</span>${c.lead && c.lead.reason && i > 0 ? `<em>${esc(c.lead.reason)}</em>` : ""}</div></li>`).join("")}</ol></section>
      <section class="card"><div class="row meta"><span>Related</span><span class="dim">${pad(st.related.length, 2)}</span></div>
        <div class="thumbs">${st.related.map(o => thumb(o.s, o.tag)).join("")}</div>
        ${ech.length ? `<div class="clip" style="--clip:168px">${ech.map(e => `<p class="echo"><b>${e.kind === "contrast" ? "CONTRAST" : "ECHO"} ${pad(e.other)}</b>${esc(e.note)}</p>`).join("")}</div>` : ""}</section>
      ${s.source_url ? `<a class="card source" href="${esc(s.source_url)}" target="_blank" rel="noopener"><span class="meta">Open in Mobbin</span>${glyph("out")}</a>` : ""}`;
  },
  selection(list) {
    const pc = new Map(); list.forEach(s => s.patterns.forEach(p => pc.set(p, (pc.get(p) || 0) + 1)));
    const ids = new Set(list.map(s => s.id)), ins = (DATA.insights || []).filter(i => i.evidence.some(x => ids.has(x)));
    return `
      <section class="card"><div class="row meta"><span>Selection</span>${closeBtn}</div><div class="dot-num">${pad(list.length, 2)}</div><div class="meta" style="margin-top:8px">frames</div></section>
      <section class="card"><div class="meta">Depth</div><div class="bars">${[1, 2, 3, 4].map(d => bar("Depth " + pad(d, 2), list.filter(s => depth(s) === d).length, list.length)).join("")}</div></section>
      <section class="card"><div class="meta">Patterns</div><div class="bars">${[...pc].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([p, n]) => bar(patById.get(p)?.name || p, n, list.length)).join("")}</div></section>
      ${ins.length ? `<section class="card"><div class="meta">Insights</div><div class="clip" style="--clip:260px">${ins.map(i => `<div class="list-item"><p class="body-text">${esc(i.text)}</p></div>`).join("")}</div></section>` : ""}
      <section class="card"><div class="meta">Frames</div><div class="thumbs clip" style="--clip:380px">${list.map(s => thumb(s)).join("")}</div></section>`;
  },
  pattern(id) {
    const p = patById.get(id), m = screens.filter(s => s.patterns.includes(id));
    const part = (t, v) => v ? `<section class="card"><div class="meta">${t}</div><div class="clip" style="--clip:180px"><p class="body-text">${esc(v)}</p></div></section>` : "";
    return `
      <section class="card"><div class="row meta"><span>Pattern</span>${closeBtn}</div><div class="title">${esc(p.name)}</div><div class="clip" style="--clip:120px;margin-top:8px"><p class="sub-text">${esc(p.summary)}</p></div></section>
      <div class="stats">
        <section class="card"><div class="meta">Frames</div><div class="dot-num">${pad(m.length, 2)}</div></section>
        <section class="card"><div class="meta">Avg depth</div><div class="dot-num">${(m.reduce((t, s) => t + depth(s), 0) / Math.max(1, m.length)).toFixed(1)}</div></section>
      </div>
      ${part("Common", p.common)}${part("Forks", p.forks)}${part("Exceptions", p.exceptions)}
      <section class="card"><div class="meta">Members</div><div class="thumbs clip" style="--clip:380px">${m.map(s => thumb(s)).join("")}</div></section>`;
  },
  overview() {
    const b = DATA.brief || {};
    return `
      <section class="card"><div class="row meta"><span>Brief / ${esc(b.date || "")}</span>${closeBtn}</div><div class="title">${esc(b.product || "Research")}</div>
        ${b.users ? `<p class="sub-text" style="margin-top:8px">${esc(b.users)}</p>` : ""}
        ${(b.questions || []).length ? `<ol class="qs">${b.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol>` : ""}</section>
      <section class="card"><div class="row meta"><span>Insights</span><span class="dim">${pad((DATA.insights || []).length, 2)}</span></div>
        <div class="clip" style="--clip:380px">${(DATA.insights || []).map(i => `<button class="list-item" data-insight="${esc(i.id)}"><p class="body-text">${esc(i.text)}</p><div class="meta dim">${pad(i.evidence.length, 2)} frames</div></button>`).join("")}</div></section>
      ${(DATA.checkpoints || []).length ? `<section class="card"><div class="meta">Agent log</div><div class="clip" style="--clip:340px">${DATA.checkpoints.map(c => `<div class="list-item"><div class="meta">${pad(c.at)}% / round ${pad(c.round, 2)}</div><p class="body-text" style="margin-top:6px">${esc(c.note)}</p>${c.next ? `<p class="sub-text" style="margin-top:4px">→ ${esc(c.next)}</p>` : ""}</div>`).join("")}</div></section>` : ""}
      ${(DATA.picks || []).length ? `<section class="card"><div class="meta">Picks</div><div class="thumbs clip" style="--clip:320px">${DATA.picks.map(p => byId.get(p.id)).filter(Boolean).map(s => thumb(s)).join("")}</div></section>` : ""}
      ${(DATA.gaps || []).length ? `<section class="card"><div class="meta">Gaps</div><div class="clip" style="--clip:260px">${DATA.gaps.map(g => `<div class="list-item"><p class="body-text">${esc(g)}</p></div>`).join("")}</div></section>` : ""}`;
  },
};

// ---------- 入场：一道从中心荡开的波 ----------
function enter() {
  st.enterT = performance.now(); for (const s of screens) s.bornAt = 0;
  const wave = Math.hypot(W, H) / 2 / 1.6;
  introT = setTimeout(() => diveAt(core.x, core.y), Math.min(wave, seaR * fitTarget().k / 1.6 + 200) + 350);
}

document.querySelector("#masthead .title").textContent = DATA.brief?.product || "Research";
document.getElementById("mast-sub").textContent = `${screens.length} frames · ${DATA.patterns.length} patterns · ${(DATA.leads || []).length} leads${DATA.brief?.date ? " · " + DATA.brief.date : ""}`;
document.title = (DATA.brief?.product || "Research") + " · Research Sea";
applyLayout(false); resize(); fit(true); lastAvail = availW(); syncSwitch();
addEventListener("resize", () => { resize(); syncTools(); if (!isDeep()) fit(); lastAvail = availW(); });
const deepLink = byId.get(+params.get("frame"));
if (deepLink) { st.enterT = performance.now() - 1e5; fit(true); requestAnimationFrame(() => pin(deepLink, 900)); }
else enter();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
