<!--
Mobbin Spec 原子组件库（Miro 风格 · Tailwind 预编译版）

用法：生成 HTML Spec 时，把下方 <style> 块整体复制到输出文件 <head>，
再按需复制组件片段并替换 {{占位符}}。组件之间可自由组合布局。

样式说明：本文件使用 Tailwind class（Miro 设计 token 已编译进 <style>，
见文件头部的 CSS 变量 --miro-*）。零外部依赖，file:// 直接打开可用。
修改 token 时同步改 <style> 变量即可全局生效。
重新编译：改 assets/spec-tailwind/ 下源文件后运行
  npx tailwindcss -i assets/spec-tailwind/input.css -o /tmp/spec.css --minify --config assets/spec-tailwind/tailwind.config.js
再把 /tmp/spec.css 内容替换回本文件"Tailwind 编译产物"块。
-->

<style>
/* ===== Miro 设计 token（编译自 Tailwind 配置，可覆盖） ===== */
:root {
  --miro-yellow: #FDE050;
  --miro-blue: #3859FF;
  --miro-blue-dark: #314CD9;
  --miro-violet: #867AFF;
  --miro-ink: #1C1C1E;
  --miro-muted: #555A6A;
  --miro-surface: #FAFAFC;
  --miro-canvas: #FFFFFF;
  --miro-mist: #F1F2F5;
  --miro-line: #C7CAD5;
  --miro-line-light: #E5E7EB;
  --miro-radius: 8px;
  --miro-shadow: 0px 0.6px 0.6px -1.25px rgba(0,0,0,.18), 0px 2.3px 2.3px -2.5px rgba(0,0,0,.16), 0px 10px 10px -3.75px rgba(0,0,0,.06);
  --miro-shadow-lg: 0px 1.2px 1.2px -1.25px rgba(0,0,0,.18), 0px 4.6px 4.6px -2.5px rgba(0,0,0,.16), 0px 20px 20px -3.75px rgba(0,0,0,.08);
  --miro-font: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}

<!-- ===== 布局骨架（每页一份） =====
     占位符：{{component_name}} {{platform}} {{date}} {{goal}}
     间距节奏：页头 40px → 区块间距 48px → 区块标题下 24px → 卡内 20px
     区块标题约定：图片收集 / 设计模式 / 建议 -->
<div class="max-w-6xl mx-auto px-6 py-12 font-roobert antialiased text-miro-ink">
  <header class="border-b border-miro-line-light pb-8">
    <h1 class="text-3xl font-bold tracking-tight">{{component_name}} 设计调研</h1>
    <p class="text-sm text-miro-muted mt-2">{{platform}} · {{date}} · 目标：{{goal}}</p>
  </header>

  <!-- 区块标题（每个内容区前用一份）：
       <h2 class="text-xl font-semibold tracking-tight mt-12 mb-6">图片收集</h2> -->
  <!-- 在这里按需插入组件 -->
</div>

<!-- ===== 组件 1：重点图卡（深挖屏幕，大图 + hover 悬浮 Mobbin 链接） =====
     每个被重点分析的屏幕一张大卡。hover 时右上角浮现来源链接，点击打开 Mobbin 原站。
     放在网格里：<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
     占位符：{{app_name}} {{screen_desc}} {{image_src}} {{mobbin_url}} {{palette_hex1}} {{palette_hex2}} -->
<figure class="group bg-miro-canvas rounded-miro shadow-miro overflow-hidden border border-miro-line-light">
  <a class="relative block" href="{{mobbin_url}}" target="_blank" rel="noopener">
    <img src="{{image_src}}" alt="{{app_name}} - {{screen_desc}}" loading="lazy" class="w-full bg-miro-mist">
    <span class="absolute top-3 right-3 rounded-full bg-black/70 text-white text-xs px-3 py-1.5 opacity-0 group-hover:opacity-100 transition-opacity">查看 Mobbin 原文 ↗</span>
  </a>
  <figcaption class="p-5">
    <strong class="text-[15px] font-semibold">{{app_name}}</strong>
    <p class="text-sm text-miro-muted mt-0.5 leading-snug">{{screen_desc}}</p>
    <span class="flex gap-1.5 mt-3">
      <i class="w-4 h-4 rounded border border-miro-line" style="background:{{palette_hex1}}"></i>
      <i class="w-4 h-4 rounded border border-miro-line" style="background:{{palette_hex2}}"></i>
    </span>
  </figcaption>
</figure>

<!-- ===== 组件 1b：参考墙（补充来源，缩略图 + 点击全屏 lightbox） =====
     所有被模式引用但未深挖的屏幕放这里，与模式卡的来源一一对应。
     每张缩略图点击后全屏查看大图（同目录 screens/ 下文件），Esc 关闭。
     放在网格里：<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
     占位符：{{app_name}} {{image_src}} {{mobbin_url}}
     说明段落（放在网格前）：<p class="text-sm text-miro-muted mt-6 mb-3">其余参考屏幕（点击查看大图）</p> -->
<button type="button" class="thumb group block w-full rounded-miro overflow-hidden border border-miro-line-light bg-miro-canvas p-1.5 cursor-zoom-in transition-shadow hover:shadow-miro" data-full="{{image_src}}" onclick="openLightbox('{{image_src}}')">
  <img src="{{image_src}}" alt="{{app_name}} 屏幕" loading="lazy" class="w-full rounded-[4px] bg-miro-mist">
  <span class="block text-xs font-medium text-miro-muted mt-1.5 mb-0.5 text-left group-hover:text-miro-ink transition-colors">{{app_name}}</span>
</button>

<style>
.thumb img { max-height: 220px; object-fit: cover; object-position: top; }
</style>

<!-- ===== 组件 2：模式卡（共性 / 差异 / 例外） =====
     步骤⑤提炼结果，每条模式一张卡。按类型复制对应示例，替换 {{pattern_text}} {{sources}}。
     [共性] -->
<article class="bg-miro-canvas rounded-miro shadow-miro p-5 border border-miro-line-light">
  <span class="inline-block rounded-full text-xs font-semibold px-2.5 py-1 bg-green-100 text-green-800">共性</span>
  <p class="mt-3 leading-relaxed">{{pattern_text}}</p>
  <p class="text-sm text-miro-muted mt-3">来源：{{sources}}</p>
</article>

<!--     [差异] -->
<article class="bg-miro-canvas rounded-miro shadow-miro p-5 border border-miro-line-light">
  <span class="inline-block rounded-full text-xs font-semibold px-2.5 py-1 bg-yellow-100 text-yellow-800">差异</span>
  <p class="mt-3 leading-relaxed">{{pattern_text}}</p>
  <p class="text-sm text-miro-muted mt-3">来源：{{sources}}</p>
</article>

<!--     [例外] -->
<article class="bg-miro-canvas rounded-miro shadow-miro p-5 border border-miro-line-light">
  <span class="inline-block rounded-full text-xs font-semibold px-2.5 py-1 bg-red-100 text-red-800">例外</span>
  <p class="mt-3 leading-relaxed">{{pattern_text}}</p>
  <p class="text-sm text-miro-muted mt-3">来源：{{sources}}</p>
</article>

<!-- ===== 组件 3：流程步骤条（调研多步流程时用） =====
     横向步骤，每步配截图。
     占位符：{{step_number}} {{step_note}} {{image_src}} {{mobbin_url}} -->
<ol class="flex gap-5 overflow-x-auto pb-2">
  <li class="flex-1 min-w-[120px] text-center">
    <span class="inline-flex w-7 h-7 rounded-full items-center justify-center text-xs text-white font-semibold mb-3" style="background:var(--miro-blue)">{{step_number}}</span>
    <a href="{{mobbin_url}}" target="_blank" rel="noopener" class="block">
      <img src="{{image_src}}" alt="step {{step_number}}" loading="lazy" class="w-full rounded-miro border border-miro-line-light">
    </a>
    <p class="text-sm text-miro-muted mt-2 leading-snug">{{step_note}}</p>
  </li>
</ol>

<!-- ===== 组件 4：建议条（可选，Spec 末尾） =====
     基于模式的推荐做法。左侧黄色锚点线标识。
     占位符：{{recommendation_text}} -->
<div class="rounded-miro bg-miro-mist p-5 border border-miro-line border-l-4" style="border-left-color:var(--miro-yellow)">
  <strong class="text-sm font-semibold">建议</strong>
  <p class="text-sm mt-2 leading-relaxed">{{recommendation_text}}</p>
</div>

<!-- ===== 组件 5：Lightbox（全局一份，放在 <body> 末尾） =====
     配合参考墙缩略图使用：点击缩略图全屏查看大图，Esc 或点击背景关闭。
     零依赖，纯内联实现。 -->
<div id="spec-lightbox" style="display:none;position:fixed;inset:0;z-index:50;background:rgba(28,28,30,.92);align-items:center;justify-content:center;padding:32px;cursor:zoom-out">
  <img id="spec-lightbox-img" alt="全屏查看" style="max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.4)">
  <button type="button" onclick="closeLightbox()" style="position:absolute;top:16px;right:24px;font-size:28px;color:#fff;background:none;border:none;cursor:pointer;line-height:1">×</button>
</div>
<script>
function openLightbox(src) {
  const box = document.getElementById("spec-lightbox");
  const img = document.getElementById("spec-lightbox-img");
  img.src = src;
  box.style.display = "flex";
  document.addEventListener("keydown", lightboxKeydown);
}
function closeLightbox() {
  document.getElementById("spec-lightbox").style.display = "none";
  document.removeEventListener("keydown", lightboxKeydown);
}
function lightboxKeydown(e) {
  if (e.key === "Escape") closeLightbox();
}
document.getElementById("spec-lightbox").addEventListener("click", function (e) {
  if (e.target === this) closeLightbox();
});
</script>
