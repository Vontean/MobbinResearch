<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Research Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="viewer/viewer.css?v=5a4a6965">
</head>
<body>
<canvas id="sea"></canvas>
<div id="marquee"></div>

<div id="boot" aria-live="polite"></div>
<header id="masthead" class="chrome">
  <h1 class="title"></h1>
  <div class="meta dim" id="mast-sub"></div>
  <div class="meta" id="mast-now"></div>
</header>
<nav id="tools" class="chrome">
  <button class="tool" id="t-insight" aria-pressed="false" title="洞察（I）"><span class="glyph" data-g="insight"></span>Insight</button>
  <button class="tool" id="t-replay" title="重播入场"><span class="glyph" data-g="replay"></span>Replay</button>
</nav>
<div id="hud" class="chrome">
  <div class="meta" id="hud-meta"></div>
  <div class="line" id="hud-line"></div>
</div>
<div id="index-box" class="chrome"><div id="index" class="clip"></div><button id="index-more" aria-label="向下滚动模式列表"></button></div>
<div id="gauge" class="chrome shift" aria-hidden="true"></div>
<div id="filterbar" class="chrome" role="status"><span id="filter-title"></span><button id="filter-close" aria-label="退出筛选"></button></div>
<div id="switch" class="chrome" role="group" aria-label="视图对比">
  <div class="seg" data-key="layout"><button data-v="island">Island</button><button data-v="lanes">Lanes</button></div>
</div>

<img id="focus-img" alt="" draggable="false">
<div id="focus-nav"><button id="nav-prev" aria-label="上一张（←）"></button><button id="nav-next" aria-label="下一张（→）"></button></div>
<aside id="panel"><div id="panel-body"></div></aside>
<div id="tip" role="tooltip"></div>

<!-- 调研数据由 scripts/build_web.py 生成；查看器各层按依赖顺序加载，见仓库根目录 ARCHITECTURE.md -->
<script src="research.js?v=1b047668"></script>
<script src="viewer/util.js?v=5a4a6965"></script>
<script src="viewer/config.js?v=5a4a6965"></script>
<script src="viewer/glyph.js?v=5a4a6965"></script>
<script src="viewer/domain.js?v=5a4a6965"></script>
<script src="viewer/layout.js?v=5a4a6965"></script>
<script src="viewer/camera.js?v=5a4a6965"></script>
<script src="viewer/stage.js?v=5a4a6965"></script>
<script src="viewer/render.js?v=5a4a6965"></script>
<script src="viewer/cards.js?v=5a4a6965"></script>
<script src="viewer/interaction.js?v=5a4a6965"></script>
<script src="viewer/ui.js?v=5a4a6965"></script>
<script src="viewer/boot.js?v=5a4a6965"></script>
<script src="viewer/live.js?v=5a4a6965"></script>
<script src="viewer/main.js?v=5a4a6965"></script>
</body>
</html>
